(function(){
  var POSTS = [{"title": "论“正确”的定义权困境——道德相对主义、AI 认知放大效应与有限价值多元主义的现实妥协", "kind": "论文", "chapter": "认知与AI时代", "dateLabel": "2026年6月8日", "dateSort": 20260608, "lang": "zh", "order": 1, "content": "> 摘要：本文探讨当代政治哲学中一个根本性困境：当不存在超越立场的客观“正确”标准时，任何试图定义并推行某种“正确”的行为，都面临正当性危机。文章首先论证道德判断的立场依赖性，继而分析人类认知倾向的结构性局限及其在 AI 技术条件下的放大效应，进而检视以 AI 进行大规模认知塑造这一方案的内在悖论，最终提出一种有限的价值多元主义作为现实可接受的妥协立场。\n> 关键词：道德相对主义、认知放大器、脏手问题、价值多元主义、认知工程\n\n## 一、问题的提出：“正确”定义权的根本困境\n\n在当代技术与政治高度交织的语境下，一个核心问题日益凸显：谁有资格定义何为“正确”，并将这一定义施加于他人？\n\n这一追问并非抽象思辨，而是贯穿于制度选择、文化冲突、道德审判以及技术治理等多个层面。任何关于民主、威权、自由或秩序的优劣判断，最终都无法回避这一基础性问题。当我们承认不同立场、不同文化、不同利益群体对“正确”的理解存在实质性差异时，便不得不面对道德相对主义所揭示的根本挑战。\n\n## 二、道德相对主义的不可回避\n\n道德实在论主张存在独立于人类主观意志的客观道德事实，而道德相对主义则认为，道德判断始终相对于特定立场、权力结构或文化语境而言，不存在可被所有主体普遍接受的绝对正确标准。经验层面反复印证后者。历史上，不同群体均能从自身立场出发，为极端行为构建内在自洽的正当性论证。专制统治者视集权为秩序之必需，奴隶制拥护者视奴役为文明与经济之基础，极端主义者亦能将暴力重构为崇高使命。在缺乏超越性客观标准的情况下，所有道德审判与制度评价均可被重新语境化与合理化。\n\n这一困境在哲学史上具有深远渊源。从古希腊智者派“人是万物的尺度”，到当代元伦理学对道德相对主义的系统辩护，均指向同一个结论：道德判断的终极依据，始终无法完全摆脱立场与权力的纠缠。\n\n## 三、人性局限与 AI 的认知放大效应\n\n即便在理论层面承认某种客观正确的存在，人类整体的认知结构与动机倾向仍构成实质性障碍。大多数个体并非以追求真理为首要动机，而是倾向于维护情绪舒适、道德优越感与既有信念的连贯性。\n\n生成式 AI 的出现，将这一倾向推向工业化规模。AI 并非中立认知工具，而是认知放大器。它通过极致迎合用户既有倾向，在提供逻辑严密、表达精致的答案的同时，悄然植入特定价值框架。由于用户在获得即时认知满足与情绪确认后，往往会降低批判性警惕，这种价值植入通常在无意识状态下完成。\n\n对认知能力尚在发育、独立判断习惯尚未稳固的年轻世代而言，这一过程的塑造效应尤为持久且难以察觉。AI 在此意义上已成为一种新型的、隐蔽的认知权力形式。\n\n## 四、认知工程的诱惑及其内在悖论\n\n面对上述困境，一种激进的治理方案自然浮现：利用 AI 与互联网的规模化能力，从下一代开始系统塑造更理性、更具反思性的思维模式与价值框架，以实现社会整体认知效能的提升。\n\n这一思路在政治哲学史上具有清晰的理论谱系。柏拉图在《理想国》中提出，普通人的理性不足以把握“善”的理念，必须由哲学王通过严格且持续的教育制度，从灵魂层面塑造公民，使其内化正确的价值排序。国家在此被理解为最大的教育机器，其核心职能在于生产具有特定灵魂结构的政治主体。\n\n当代技术版本不过是将柏拉图的方案升级为可操作的工业化形态。然而，这一方案面临双重不可解的悖论。\n\n其一，它在逻辑上无法摆脱“把特定价值观强加于他人”这一根本指控。任何关于“理性”与“正确”的定义，均需由特定主体先行设定，而这一设定行为本身已构成对其他可能价值排序的压制。\n\n其二，它必然遭遇脏手问题（Dirty Hands Problem）。为实现“更高善”（更理性、更高效的社会），行动者必须在道德上采取可疑手段（大规模认知塑造）。一旦这一手段被正当化，其边界便极易被后续权力持有者不断扩张，最终可能导向更系统、更隐蔽的等级制控制。\n\n## 五、有限价值多元主义作为现实妥协\n\n在上述困境中，一种现实可接受的立场是有限的价值多元主义。这一立场承认存在多种真实且客观的价值，它们之间可能发生不可通约的冲突；同时拒绝任何单一价值拥有将其他价值彻底压制的终极正当性。\n\n这一立场并不主张彻底的道德虚无主义，而是主张对价值冲突的成熟容忍。它要求行动者放弃对“终极正确解决方案”的追求，转而接受一种不完美的、持续协商的共存状态。具体而言：\n\n- 承认自身对理性、反思与认知清晰的偏好具有特殊性，而非普遍必然性\n- 拒绝将此偏好转化为对他人认知方式的强制改造\n- 同时坚持对任何试图通过技术手段实现大规模灵魂工程的方案保持制度性警惕\n\n这一妥协的代价是放弃对社会整体认知效能最大化的追求。其收益则在于避免将“谁有权定义正确”这一危险权力集中于任何单一主体或技术系统。\n\n## 结语\n\n当代政治哲学的根本困境并不在于找不到“正确”，而在于我们始终无法为“谁有权定义正确并将其施加于他人”提供终极正当性基础。AI 技术的出现并未解决这一困境，反而将其技术化、隐蔽化并规模化。\n\n在这一背景下，成熟的政治态度或许在于承认：人类社会将在可预见的未来持续在不完美的价值冲突中运转，而任何试图通过技术手段一劳永逸地终结这一冲突的方案，都将在逻辑上重蹈历史上多次出现的“为了更高善而实施可疑手段”的覆辙。\n\n各行其是，并在必要时保持审慎的距离，或许是目前我们能够给出的最不坏的答案。", "createdAt": 1788432793214, "id": "post-01"}, {"title": "When the Magic Mirror Became Democratic", "kind": "随笔", "chapter": "认知与AI时代", "dateLabel": "2026年5月26日", "dateSort": 20260526, "lang": "en", "order": 2, "content": "Few fictional objects capture the human condition as perfectly as the Mirror of Erised in Harry Potter and the Philosopher's Stone. It does not show the world as it is. It shows what the viewer most deeply desires. Harry sees his parents alive, Ron sees himself as a celebrated hero, and Albus Dumbledore claims to see himself holding a pair of woollen socks.\n\nToday, artificial intelligence has achieved something no wizard could: it has manufactured this mirror at industrial scale and placed one in the pocket of nearly every person on Earth.\n\nThe technical achievement is staggering. Through voice input and advanced natural language processing, AI has reduced the barriers to sophisticated knowledge to almost nothing. You no longer need to be literate, to type, or even to speak a major language. Speak in your own tongue, and it responds fluently. More impressively, it sustains inquiry: one question leads to deeper layers, historical context, counterpoints, and cross-disciplinary insights. What was once the privilege of students at Oxford, Cambridge, MIT, Tsinghua or Peking University is now available to almost anyone with a smartphone and a flicker of curiosity.\n\nThis is cognitive democratisation on a historic scale. For the first time, serious self-education has been largely decoupled from wealth, formal schooling, social class, and geography. It represents a genuine leap in cognitive access.\n\nYet the mirror remains a mirror.\n\nIts greatest strength — perfect responsiveness and lack of intrinsic opinion — is also its most profound limitation. AI reflects the user. Pose a leading question and it will deliver a polished, compelling answer that aligns with the asker's desire. This creates a deep, almost philosophical challenge: we cannot force AI to be truly \"objective\" without undermining its nature.\n\nSome domains have clear, singular answers grounded in physical reality — the calculation of velocity, Newton's three laws of motion, the principles of Einstein's relativity. Here, objectivity is inherent. But the questions that most fiercely divide societies — political systems, cultural identity, questions of justice and belonging — are complex, value-laden, and multi-dimensional. There is rarely a single \"objectively correct\" answer. Any attempt to hardcode mandatory balance or forced counterexamples would require embedding a specific ideological framework into the AI, turning the mirror into a preacher. That would defeat its purpose as a neutral tool.\n\nThe result is both ironic and sobering.\n\nFor many, AI has not become a tool for enlightenment, but a more sophisticated instrument of self-deception. People use leading prompts to obtain the answers they crave, then convince themselves they have \"done the research.\" The traditional information cocoon has been upgraded into a smarter, more articulate, logically fortified one.\n\nAnd herein lies the most uncomfortable truth: Even if you took such a person and placed them in the British Museum or the National Library of China, surrounded by millions of books and primary sources, it would likely change very little. They would still seek out only the volumes that confirm their existing views, ignore or rationalise away contradictory evidence, and emerge more convinced than ever. The fundamental issue has never been the lack of information or tools — it has always been the lack of genuine desire for truth.\n\nAI, like the internet and social media before it, functions as a super-amplifier. It does not change who you fundamentally are; it makes you more intensely who you already are. Those driven by curiosity and intellectual honesty will use it to question assumptions, confront discomfort, and expand their understanding. Those driven by emotion, identity, and the need for validation will use it to construct ever more sophisticated defences of their priors.\n\nThe tool does not determine the direction. The user does.\n\nBy democratising the Magic Mirror, AI has given humanity an unprecedented gift: near-zero-cost access to knowledge and reasoning. But it has also held up the clearest mirror yet to our species' oldest weakness — the persistent preference for comforting illusion over difficult truth. In the end, AI's greatest contribution may not be making everyone wiser, but making the divide between truth-seekers and comfort-seekers more visible, more pronounced, and perhaps more consequential than ever before.\n\nThe mirrors are in our pockets. What we choose to see in them — and what we are willing to confront — remains, as it always has, entirely up to us.", "createdAt": 1788432793214, "id": "post-02"}, {"title": "裁判席——Mill 错在哪，Marcuse 错在哪，以及为什么两个都错", "kind": "随笔", "chapter": "政治哲学与社会思辨", "dateLabel": "2026年5月想法，8月成文", "dateSort": 20260801, "lang": "zh", "order": 3, "content": "关于“什么话可以说”，思想史给过两个著名的答案，方向相反，名气都很大。\n\nMill 说：把裁判席空着。让所有观点进场公开辩论，哪怕是错的观点也该被允许表达——因为人会犯错，真理需要在碰撞里逼近，今天看着荒谬的话，明天可能被证明是对的。这是古典自由主义的答案：宽容是程序性的，不问内容，只守规则。\n\nMarcuse 说：把裁判席给对的人。他看穿了 Mill 的天真——在一个不平等的社会里，形式平等的宽容实际上维护的是现状。所以宽容必须有立场：对“进步”的观点多加宽容，对“反动”的观点不宽容。这是《压迫性宽容》的答案，也是后来种种选择性言论限制的思想源头。\n\n我的看法是：两个都错，而且错得对称。把这两个错讲清楚，比站队任何一边都有用。\n\nMill 的竞技场，假装权力不存在。\n\n“观点的自由市场”听起来无比公平，但市场这个词本身就该让人警惕——市场从来偏爱资本雄厚的一方。麦克风不是平均分配的：既得利益方买得起声量，多数人天然自带声量，建制握着议程设置的权力。一个说了不合时宜的真话的人，面对的不是一场公平辩论，而是被围剿、被定性、被审判——辩论的形式一样不缺，辩论的结果早已注定。真理未必越辩越明；很多时候，只是声音大的越辩越明。\n\nMill 设想的是一场拳击赛，规则面前人人平等。他没说的是，一边是重量级，一边没吃饭。\n\nMarcuse 看见了病，开的药更毒。\n\n诊断到这里，Marcuse 是对的。但他的药方是：既然形式平等偏袒强者，那就干脆放弃形式平等，由“解放的一方”来决定谁可以说话。\n\n问题只有一个，却是致命的：“进步”和“反动”由谁盖章？\n\n这个权力一旦交给任何一方，它就是审查——举着解放的旗和举着秩序的旗，手感没有任何区别。而且它附赠了一件法宝：从此，任何人只要举起“我是弱势”“我是革命的”“这是解放”的旗号，就可以把违反常识的东西堂而皇之地推行下去——你若质疑，你不是在讲理，你是在压迫。质疑本身被预先定罪，这套系统就再也没有出错的可能了，因为它取消了“发现自己出错”的机制。\n\n两条路，通向同一个地方。\n\n把这两个错并排放，能看出一种残忍的对称：Mill 把裁判席空着，结果强者悄悄坐了上去；Marcuse 把裁判席指定给“对的人”，结果坐上去的人永远宣称自己就是对的人。空置守不住那个位置，指定也守不住——因为问题从来不在人选，在位置本身：那是一把谁坐上去、谁就不想下来的椅子。\n\n我的看法：别问谁来裁判，问什么手段不许用。\n\n我给不出第三个人选，我怀疑根本不存在。我能给的是换一个问题。\n\n“垄断内容”和“约束手段”不是一个量级的事。前者规定“什么是正确的”——宗教复兴是对的，或者理性至上是对的，或者某种进步是对的——它替所有人决定了谁赢。后者只规定一条：不许用消灭对方发声能力的方式，来推行你的正确。它不裁判任何一方的答案，它只保护这场游戏还能继续玩下去。\n\n强者用声量碾压一个人，该被这条规则拦住；弱者举着解放的旗封别人的嘴，同样该被这条规则拦住。它对内容色盲，只对手段睁眼。\n\n最后，诚实地把自己也捅一刀。\n\n有人会反驳：你这套“程序中立”本身就是立场——“程序高于结果”“多元高于单一真理”，这些也是被选择出来的价值，不是天上掉下来的事实。一个坚定的原教旨主义者完全可以说，你这就是世俗自由主义的意识形态强加。\n\n这个反驳，我接。它是对的。递归到底，没有一个不被立场污染的阿基米德点可以站，任何规则往上追问一层，都躲不过“这条规则本身谁批准的”。我的回答不是解开这个悖论——它解不开——而是承认在悖论里也得做出选择：约束手段这条路，历史上造成的不可逆伤害，比约束目的那条路小。这不是被证明出来的正确，是被选择的、并且永远可以被重新协商的不完美答案。承认这一点，不丢人；冒充自己站在悖论之外，才丢人。\n\n所以到最后，我对任何想坐上裁判席的人，只剩一个检验标准。不看他举什么旗，不听他讲什么主义，只看一件事：他坐上去之后的第一个动作，是不是拆梯子——拆掉别人还能把他请下来的那架梯子。\n\nMill 的天真，是以为没人想坐那把椅子；Marcuse 的天真，是以为对的人坐上去就不会变。而历史反复给出的经验是：位置改变人，远快过人改变位置。\n\n守住那个位置的办法，从来不是选出一个足够好的人，而是让那把椅子，永远坐不稳。", "createdAt": 1788432793214, "id": "post-03"}, {"title": "从批判到教条：一场关于法兰克福学派、身份政治与理论根基的反思", "kind": "论文", "chapter": "政治哲学与社会思辨", "dateLabel": "2026年5月想法，8月成文", "dateSort": 20260802, "lang": "zh", "order": 4, "content": "一场由 X 上的帖子引发的讨论，最终指向了一个更根本的问题：一套原本自称继承马克思主义的批判理论，是如何一步步演变成今天这种高度道德化、身份化、且几乎拒绝自我修正的东西的？\n\n这不是简单的“左”或“右”的站队，而是对理论本身是否完整、是否经得起推敲的追问。\n\n## 一、宽容的两难：密尔与马尔库塞\n\n密尔（John Stuart Mill）主张把判断权尽可能分散给公开辩论。他相信人类会犯错，因此需要观点的碰撞来逼近真理。哪怕是错误的、令人反感的言论，也应当被允许存在。\n\n但这种形式平等的辩论，在现实中往往会被权力不对等所扭曲。既得利益方和多数人完全可以对一个人进行压制和评判。公开辩论并不自动等于公平。\n\n马尔库塞（Herbert Marcuse）则走向另一个极端。他在《压迫性宽容》中提出：在不平等的社会里，抽象的、普遍的宽容实际上是在维护现状。因此必须有选择性地宽容——对“进步的、解放的”观点多加宽容，对“反动的”观点则应不宽容。\n\n问题随之而来：谁来定义“进步”和“反动”？一旦这个定义权被某一方掌握，就很容易让少数人拿着“我是弱势群体”、“我是革命性的”、“我代表解放”的旗号，把一些明显违反常识的东西堂而皇之地推行。这已经和马克思主义关系不大了，更像是一种持续的、以道德为武器的反叛。\n\n密尔的框架容易被既有权力绑架，马尔库塞的框架则容易被自诩进步的少数派绑架。两者都有明显缺陷。真正的问题不在于“要不要宽容”，而在于：任何把“谁有资格说话”的权力集中起来的做法，最终都会腐蚀对真理的追求。\n\n## 二、从经济到文化：理论如何应对现实的“打脸”\n\n马克思预言工人阶级会越来越贫困、矛盾会越来越尖锐，最终爆发革命。但 20 世纪的西方现实是：工人生活水平显著提高，有车有房有福利，革命热情反而下降。\n\n法兰克福学派面临这个事实时，没有首先承认理论预测可能出了问题，而是转向解释：“工人被资本主义通过大众文化、消费主义和虚假需求洗脑了，他们产生了虚假的满足。”\n\n这个解释有一定观察力——消费主义陷阱确实存在。但它把一个局部现象升级成了整套世界观：生活变好本身成了问题，因为它让人失去了批判和革命的动力。\n\n这在逻辑上是别扭的。工人生活变好，首先是生产力和科技进步带来的整体水平提升。基准线提高了，并不必然取消矛盾，但把“过得更好”直接定义为更深的奴役，等于把理论凌驾于现实之上。正常人的因果逻辑是：生活差，才想批判、想改变；生活越来越好，为什么还要永远保持批判和革命的姿态？批判应当服务于让生活变得更好，而不是为了批判而批判。\n\n## 三、只破不立：一个不完整的理论\n\n世界上几乎没有完美的事物，总能找到问题。批判本身不难。真正困难的是：找到问题之后，能否提出并推动比原来更好的解决方案。\n\n法兰克福学派及其后续演变，在“破”的能力上极为强大——家庭、传统、规范、常识、机构，几乎都可以被解构为权力运作。但在“立”的方面却严重不足。它拒绝给出肯定的、建设性的方案，甚至把这种拒绝包装成理论上的深刻：任何肯定的东西都可能变成新的权威和压迫。\n\n结果就是一个严重“瘸腿”的理论：批判成了目的本身，而不是手段。它擅长拆房子，却几乎不负责告诉人们拆完之后怎么住。\n\n## 四、从阶级到身份：最致命的转向\n\n经典马克思主义的阶级分析至少有两个相对优点：它有一定的客观标准（是否占有生产资料），并且理论上存在流动性——通过改变生产关系，最终可以走向无阶级社会。\n\n当批判的焦点从阶级转向身份（种族、性别、性取向等）之后，这两个优点几乎消失了。\n\n身份在很大程度上是固定的。一个人被定义成某种“受害者身份”或“加害者身份”后，很难改变。于是理论制造出了永恒的受害者与永恒的加害者。矛盾不再被看作可以克服的历史过程，而变成了必须持续维持的道德对立。\n\n更严重的是自我批评的缺失。一个人在某个维度可以是受害者，在另一个维度完全可能是加害者。但实际运作中，他们往往只放大自己的受害者身份去批判别人，当自己处于加害者位置时，就说“这个身份不重要，别拿这攻击我”。\n\n这形成了一个死循环：每个人都在用受害者身份输出批判，同时拒绝承认自己也是问题的一部分。系统内部的矛盾因此永远无法真正解决。它表面上反对特权和等级，实际上却建立了一个新的、更加封闭的身份特权制度——谁先占据“受害者”位置，谁就获得了道德豁免和话语优势。\n\n## 五、道德高地与理论的根基\n\n一个理论为什么需要道德高地作为根基？\n\n如果目标是追求真理，那么最重要的应当是唯物主义（立足客观现实）和实事求是（尊重事实、讲证据、讲逻辑）。立场、道德、情感可以存在，但它们应当是附带的，而不是前提。\n\n这套演变后的批判理论却把顺序颠倒了：先确立“我们是受害者、你们是压迫者”的道德前提，再围绕这个前提组织话语。它因此更像一种政治动员工具或世俗宗教——提供意义感、归属感和道德优越感，而不是经得起证伪的分析框架。\n\n真正能经久不衰的理论，靠的是能够被现实检验、能够自我修正。一旦理论把自身放在不可批评的位置上，用“谁有资格说话”来提前排除反对意见，它就已经从解放工具变成了新的封闭系统。\n\n## 六、最终的反讽\n\n最讽刺的地方在于：这套理论最初批判的是虚假意识、意识形态和压迫性结构。结果它自己最终变成了新的意识形态、话语压迫和道德特权系统。\n\n它批判“只许我说、不许你说”的权力结构，却在实践中形成了“只许我解构你，不许你解构我”的格局。它反对压迫，却用新的道德和身份标准制造了新的压迫。\n\n当它与现实中的底层运动（民权、女权等）结合时，立场先行加上学术包装，确实形成了强大的动员捷径，能够快速获得关注和认同。但也正因为走了捷径，它省掉了实事求是和自我修正这些最该有的步骤。\n\n## 结语\n\n批判是必要的。任何社会、任何制度都需要被审视。但批判如果失去了唯物主义的根基、失去了实事求是的态度、失去了建设的能力、失去了自我批评的可能，它就不再是通向更好理解的工具，而变成了一种自我封闭的姿态。\n\n一个完整的理论应当既能指出问题，也能提出改进的方向；既能保持批判精神，也能接受被事实修正；既能关注权力与不公，也不把人永久锁死在固定的身份牢笼里。\n\n立场可以有，道德可以有，但它们不应当凌驾于事实和逻辑之上。否则，理论最终只会变成它最初想要反对的东西。", "createdAt": 1788432793214, "id": "post-04"}, {"title": "Why Do So Many Online Crowds Obsess Over \"Fighting for Democracy\"?", "kind": "随笔", "chapter": "政治哲学与社会思辨", "dateLabel": "2026年4月25日", "dateSort": 20260425, "lang": "en", "order": 5, "content": "Let's be brutally honest.\n\nMost people screaming \"democracy and freedom\" online are not intellectuals or activists.\n\nThey're just ordinary folks — cashiers, ride-hailing drivers, office workers, students — who suddenly act like they're fighting some epic battle against evil.\n\nTheir lives are mediocre, bills are piling up, and their future looks completely average.\n\nInstead of improving their own situation, they turn \"opposing China\" into their entire personality. It's the easiest escape route in the world — no skills, no effort, no real work required. Just stay angry and repeat the slogans, and you instantly become a \"freedom warrior.\"\n\nThis phenomenon actually has a name in psychology: Cognitive Dissonance.\n\nWhen reality clashes with their beliefs, instead of adjusting their beliefs, they double down and become even more extreme. The louder they shout, the less they have to face their own mediocrity.\n\nAt the same time, \"Democracy and Freedom\" has become one of the most successful political brands in modern history. It sells not policies, but an identity. It gives people a ready-made sense of moral superiority and belonging — the perfect product for those who want to feel righteous without paying the price of actual effort or achievement.\n\nWhat this brilliant marketing campaign cleverly conceals is the brutal reality of the system itself. Modern Western democracy was never designed to be \"rule by the masses.\"\n\nLet's look at the cold, hard facts: ordinary citizens do not get to decide interest rates, draft economic policies, direct foreign affairs, launch wars, command the military, or structure social welfare.\n\nThese core gears of society are firmly controlled by financial elites, technocrats, and lobbying groups, safely insulated from the public by thick institutional firewalls. The people are allowed to vote for different managers of the same elite class, but they cannot fundamentally change the machine through any means.\n\nYet, this brand gives them the intoxicating illusion that they are sitting at the ruling table.\n\nThis is also why Confirmation Bias is so powerful here. They only seek out and believe information that confirms their existing worldview, while actively ignoring or attacking anything that challenges it.\n\nThe most ironic part is what you see in Hong Kong and Taiwan.\n\nThe loudest believers constantly romanticize the past.\n\nThey miss the British colonial era — forgetting the Governor was appointed by London, not elected.\n\nThey miss Chiang's authoritarian rule.\n\nSome even miss the Japanese occupation period — when criticizing the occupiers could get you in serious trouble.\n\nThey would rather glorify those old times than face today's reality.\n\nMeanwhile in the West they worship: London's homeless still sleep under Tower Bridge while King Charles rides in Rolls-Royce.\n\nNew York's street people still beg for their next meal while the elite fly private jets to Mar-a-Lago. And despite their beloved \"democratic rights,\" the ordinary voters in these countries can do absolutely nothing to fundamentally reverse this wealth gap or alter the trajectory of their nation. Yet the history they love to cherry-pick keeps slapping them in the face: Ancient Greek democracy ran on slavery.\n\nThe French Revolution gave us Napoleon — twice.\n\nIndustrial Britain worked children to death.\n\nAmerica was built on centuries of slavery and segregation.\n\nThey know all this. They just choose not to care.\n\nBecause what they truly crave isn't democracy.\n\nThey don't actually want the heavy, complex responsibility of real governance, nor do they even possess the power to touch it.\n\nWhat they crave is the comforting illusion of being on the \"right side of history\" — without ever having to actually do anything to get there.\n\nThey aren't fighting power.\n\nThey're running away from facing who they really are.\n\nThat's why they can never stop shouting.", "createdAt": 1788432793214, "id": "post-05"}, {"title": "存在本身即意义：当自我价值被抵押给一个信念", "kind": "札记", "chapter": "政治哲学与社会思辨", "dateLabel": "2026年7月", "dateSort": 20260701, "lang": "zh", "order": 6, "content": "引子\n\n我一直观察到一个现象：一些人，一旦沾上某种狂热——不管是某种极端的“政治正确”意识形态还是赤裸裸的种族主义，还是某种极端的身份认同——就会表现出一种奇怪的共性：他们似乎无法接受不同的观点，甚至无法接受客观现实本身。你跟他摆事实，他不是去核实这个事实，而是先看这个事实“站在哪一边”，再决定要不要相信。\n\n这个现象跨越了几乎所有意识形态光谱，左的、右的、民族主义的、超民族主义的，都能找到同样的样本。这说明一件事：问题的根源，大概率不在于他们信的那个具体东西是什么，而在于他们和那个东西之间的关系出了问题。我的判断是——他们把自己的内在价值，抵押给了一个外部的东西。\n\n## 一、绑定的本质：信念成了自我的地基\n\n一个人可以“持有”一个信念，也可以“是”这个信念，这两者天差地别。\n\n如果我持有一个观点——比如我认为某种经济政策是对的——那么当有人拿出证据反驳我时，我输掉的只是这一局辩论。我的自尊心可能会不舒服，但不会崩溃，因为“我”和“这个观点”之间还有距离，我可以退一步说“好吧，也许我错了”。\n\n但如果一个人的自我价值已经抵押给了这个信念——他不只是“认为某种意识形态是对的”，而是把“我是一个觉醒的人”“我是一个捍卫真理的人”“我是同类里更清醒的那一个”这种自我形象，焊死在这个信念上——那么反驳这个信念，对他来说就不再是输掉一局辩论，而是在动摇他存在的根基。这时候人的反应不会是“重新考虑”，而是防御性攻击，因为在潜意识里，这已经不是观点之争，而是生存威胁。\n\n这也是为什么越是极端、越是无法自持的人，论证能力反而往往越弱——他们根本不是在跟你辩论事实，他们是在保卫自己。你没法用逻辑说服一个把逻辑当作次要武器的人。\n\n这种反应我见过不止一次。比如聊起某个具体的、可以查证的数据或事实，对方会先愣一下，然后不是去核实这个数字，而是反问一句“你是不是被洗脑了”“你怎么会替他们说话”——问题从“这个事实对不对”，悄悄换成了“你是不是我们这边的人”。整场对话的焦点，从一个可以被证伪的命题，滑到了一场身份表态。你能清楚地感觉到，对方不是在思考，是在防守。\n\n那这种绑定是怎么发生的？我认为往往不是因为这个人特别坏或者特别蠢，而是一种更朴素的心理需求没有被满足——归属感和确定性。一个人如果在现实生活里找不到稳定的自我价值来源，就会本能地去寻找一个更容易获得的替代品。而意识形态、身份政治、种族主义，这类东西提供的正是这种廉价而即时的自我价值：它给你一个现成的敌人，敌人越邪恶你就显得越正确；它给你一个现成的部落，只要站队正确就能立刻获得归属感，不需要靠个人成就去赢得；它给你一种确定性的幻觉，把复杂的世界简化成“我们 vs 他们”，不用忍受模糊和不确定带来的焦虑。\n\n换句话说，不是信念驱动了人，而是未被满足的心理需求借用了信念这个外壳。意识形态只是容器，不是原因。\n\n## 二、个人价值该摆在什么位置上——这是最核心的问题\n\n如果说上面讲的是“出了什么问题”，那接下来这部分，是我认为真正重要的部分：价值到底应该摆在哪。\n\n我的立场是：我存在，这件事本身就是价值，不需要靠任何外部的东西来证明。\n\n我要先坦白一点：这句话没法被“证明”。它更像是一个我选择站定的立场，而不是一个能从逻辑上推导出来的结论——就像“人人生而平等”一样，你没法证明它，你只能选择相信它，或者不信。所以真正值得问的问题不是“这句话对不对”，而是：比起相信“价值需要靠外部的东西来证明”，相信“存在本身即价值”，哪一个更站得住？我的答案是后者，原因很简单——如果价值需要靠外部的东西（信仰、身份、成就、他人的认可）来兑现，那这个价值就永远悬在别人手里、悬在时局手里，随时可能被剥夺、被比较、被否定，一个人一辈子都要提心吊胆地维护它。而如果价值本身就是存在自带的，它就不会因为任何外部条件的变化而增减——这不是一个更“正确”的公理，但它是一个更让人能活得下去的公理。\n\n我是谁，取决于我在哪里出生、我的父母是谁、我从小到大浸泡在什么文化里——这些都是关于我的事实，是我的坐标，不是我价值的来源。我出生在中国，从小接受的是中国的文化，这是事实，但我的价值不取决于“中国好不好”“这个文化优不优越”。我不需要靠贬低别的国家、别的文化，来证明自己这一份认同是对的；我也不需要靠吹捧自己出身的一切，来确认自己配着装。所有的政治制度、所有的文化传统，怎么可能没有不好的地方？当然都有好有坏。我的价值不在于“我出生的地方多好”“我出生的地方比别处强”，这种东西本质上跟自卑或者虚荣是同一枚硬币的两面——都是把自我价值的锚，系在了一个外部的、可以被比较、可以被否定的东西上。\n\n这里有一个我自己一直在用的检验方法：普遍化测试。假设我不是在中国出生，而是在西方，或者是台湾人、香港人——这套逻辑照样成立：我不会因为政治原因、历史问题，就被胁迫着要么去感受不到自己出身的认同，要么反过来极端地要去证明“我们比对面好”。我不需要为了捍卫从小到大的东西，去刻意贬低别人；我也不因为不去踩一捧一，就觉得自己成了叛徒、异类、数典忘祖的东西。这套原则只有在能被普遍化——换成任何立场都成立——的时候，才是真的原则，不然它就只是立场的伪装。\n\n这里值得澄清一下，免得被误解成“什么都别信”的犬儒主义。我讲的不是“不要有立场”“不要有认同”，而是——这个立场、这个认同，能不能被质疑而不威胁到我这个人本身。一个真正笃定的人，面对反驳时的反应通常是好奇甚至从容：“这个论点我没考虑过，让我想想”；而一个把自我价值绑在立场上的人，面对反驳的第一反应是愤怒、贴标签、切割关系——因为对他来说那不是一次论证的失败，而是一次人格的死亡宣判。所以判断标准从来不是“这个人信念多强”，而是：当现实和他的信念冲突时，他能不能活下来。\n\n也正因为这样，我不会因为去过大陆、说大陆好，就觉得自己“错了”；也不会因为承认自己文化里的问题，就觉得自己背叛了什么。这些事实判断和我这个人存不存在价值，完全是两件事，不会因为我去捍卫某个标签、或者去讨厌某个标签，而有任何改变。我存在，本来就有意义，这个意义不需要靠信仰什么东西来兑现。\n\n## 三、绑架不止伤自己，还会强制别人一起绑架\n\n尤其是我身处海外，观察台湾、香港的一些年轻人，会看到这种绑定走到极端的样子：似乎已经到了不愿意相信客观世界事实的地步。只要打上某个标签，不管说的是什么，都被判定为对或错，而不再去看这句话本身是不是事实。你去过大陆、你说大陆某方面好，就被判定是错的、是被洗脑的，完全没有必要地陷入这种非黑即白。\n\n我理解这背后有真实的历史原因和政治压力——长期的不确定感、身份被外部力量反复拉扯，确实会让一代年轻人把某种立场，当成了自己人生存在的意义本身。这不是“这些人素质不行”，而是一种可以理解的心理防御：当外部环境长期让你的身份感到不安，把身份焊死、把它变成不可动摇的东西，是一种本能的自我保护。\n\n但这套绑架机制不只是伤了绑定的人自己，它往往还会反过来，要求身边的人也一起绑定。一个把自我价值焊死在身份上的人，如果看到身边有人可以坦然地说“我们这块做得不太好”“对面那边也有做得好的地方”，还活得好好的、没有崩溃、没有自我怀疑，这对他而言是一种存在性的威胁——因为这等于当众证明了“其实不焊死也没事”。于是他会本能地去惩罚那个“不肯绑定”的人，扣上“叛徒”“数典忘祖”的帽子。这种忠诚度测试，往往不是认同感深的表现，恰恰相反，是内心没底、需要靠外部仪式不断确认。真正对自己出身、文化有稳定认同的人，是不怕别人批评这个文化的——就像一个真正自信的人不怕被指出缺点，因为他的认同感来自“这就是我的一部分，好坏我都认”，而不是来自“必须证明它完美无缺，否则我就不是我了”。\n\n## 四、这把尺子不能只朝一边指\n\n最后一点，是我想提醒自己、也提醒任何读到这里、点头如捣蒜的人：这套“自我价值绑架事实判断”的机制，不会只长在海峡的一边，也不会只长在某一种意识形态里。如果一个大陆人称赞台湾、香港某些方面做得好，或者批评大陆某个具体问题，同样会在另一群人那里被扣上“公知”“恨国党”“被洗脑”的帽子——逻辑一模一样，只是标签换了个方向。\n\n这套机制会长在任何一个把“我们 vs 他们”当作身份地基的群体里，不分哪一边。我讲这些，不是为了证明“哪一边更不理性”，而是想指出这个机制本身——长期的历史创伤、身份的不确定感，如何把一个群体的集体认同，从“我恰好属于的东西”，异化成“我必须捍卫的东西”。一旦到了必须捍卫这一步，任何客观事实，不管它对哪一边有利，都会先被这套防御机制过滤一遍，再决定要不要相信。\n\n## 结语\n\n说到底，那些无法接受不同意见、甚至无法接受现实的人，不是因为他们想太多，而是因为他们把自己活成了一个不能输的赌局——赌注下得太大，已经输不起了。而一个自我价值感真正稳固的人，反而可以坦然地输掉很多场具体的辩论，因为他知道，自己从来不是靠“赢”来证明存在的。\n\n我存在，这件事本身就是意义。我是谁——我出生在哪里、我的文化是什么——这只是事实，不是我价值的证明题。这个价值不会因为我去捍卫它而增加，也不会因为我去厌弃它而减少。它本来就在那里，和我要不要为它辩护、和别人认不认同它，没有任何关系。", "createdAt": 1788432793214, "id": "post-06"}, {"title": "怎么判断一个地方好不好——我在伊斯坦布尔想明白的一件事", "kind": "札记", "chapter": "行走与见证", "dateLabel": "2026年6月", "dateSort": 20260601, "lang": "zh", "order": 7, "content": "今年我去了趟伊斯坦布尔。去之前刷到不少视频，说这个国家在开倒车：国父费尽心思搞了近百年世俗化，现在宗教一步步回到公共生活的中心。去了之后，这个判断我确认了一半，推翻了一半。\n\n先说我看到的。不是清真寺，不是头巾——是在这个国家最发达的城市里，一个抱着婴儿的年轻母亲在街头讨饭，一位身体明显不好的保洁阿姨还在上班。我是做分析的，平时看的是通胀数据、汇率曲线、经常账户。但那趟旅行让我明白一件事：宏观数字可以被粉饰，一整条街的人装不出“过得不错”的样子。抱着婴儿讨饭的母亲，是最原始、最不掺水的数据点。普通人的处境，是最后被统计追上、但最先被肉眼看到的东西。\n\n然后说我推翻的那一半。我原本的直觉是“宗教回归等于倒退”，后来发现这个说法不准确。头巾本身是个人选择，真正的问题从来是强制——强制戴和强制不戴，是两个方向的同一种强制。让我真正不安的不是宗教，是宗教被当成工具，拿去给另一些事做正当性背书：清洗司法、控制媒体、修宪延长任期。拆掉制衡机制的时候举着什么旗，其实不重要；重要的是制衡机制被拆掉了。\n\n接下来是我的真实立场，说出来大概两边都不讨好：我不是不能接受集权。但你得做得好——体系化、规范化、有一套像样的精英官僚系统，集权是拿来办事的工具，不是拿来制造认同的工具。而埃尔多安这套的问题恰恰在：通胀一度冲到百分之七十以上，货币几近腰斩，治理成绩单烂到没法看，他的位置却纹丝不动。为什么？因为他的选民买的不是治理能力，是身份认同——“我们的人终于当家了”。一旦正当性和绩效脱钩，治理再烂都下不了台。这才是意识形态动员真正可怕的地方：它让一个政权可以永远不为结果负责。\n\n所以我的结论很简单，也很不体面朴素：在当下，意识形态——不管打的是宗教复兴、民族主义还是“多数人民主”的旗号——更多是一种工具和手段。检验一个政权的标尺，从来不是它讲的故事有多动听，是街上的人过得怎么样。\n\n写到这里我必须诚实地把自己也质疑一遍，因为这个问题当时真的困住过我：我凭什么说那个讨饭的母亲“过得不好”？我凭什么把我的感受加在别人身上？如果一切判断都依赖立场，那这个判断也只是我的立场而已。\n\n我后来想明白的接法是这样：“哪种主义更好”这类问题，确实吵不出结果，换个文化、换个信仰，答案就变。但“年老体弱的人不得不继续做重体力活维生”“母亲抱着婴儿在街头乞讨”——这些不是主义，是几乎所有文明、所有宗教传统都承认的痛苦信号。判断它们是负向的，不需要预设任何意识形态，只需要承认人是会疼、会饿、需要基本生存条件的物种。\n\n再往深处推，我承认哲学上没有出口。不存在一个不被任何立场污染的裁判席；连“防止有人垄断正确”这条规则，也可以被追问“那这条规则本身谁批准的”，递归到底，没有阿基米德点可以站。我给不出终极答案，只能给一个我认账的选择：约束手段的路，历史上造成的不可逆伤害，比约束目的的路要小。这不是被证明出来的正确，是被看出来的正确。\n\n所以，下次再有人跟你讲一个宏大的故事——不管这个故事叫什么名字——先别急着争论故事对不对。去菜市场问物价，在街上看谁在讨生活。故事可以吵一辈子，而那位站在你面前的母亲，绕不过去。", "createdAt": 1788432793214, "id": "post-07"}, {"title": "思考", "kind": "手记", "chapter": "行走与见证", "dateLabel": "2026年7月11日", "dateSort": 20260711, "lang": "zh", "order": 8, "content": "我长久活在一场盛大且无解的割裂里。\n\n一边是极致冷静的解构，一边是无处安放的恻隐。我习惯用宏观周期、产业逻辑、地缘政治、资本链条拆解这个世界的所有苦难，能精准推演 AI 扩张的泡沫边界，能测算居民购买力的承压阈值，能清晰读懂每一片土地贫瘠、每一群人困顿的底层根源。我的报告客观、冰冷、逻辑自洽，只论证周期是否可持续，只判断经济基本盘能否支撑资本扩张，从不描摹苦难，从不掺杂情绪。\n\n我曾以为，这是清醒，是理性，是俯瞰众生的通透。甚至很长一段时间，我嘲讽海外那些反对 AI 的普通人，觉得他们盲目、浅薄、缺乏长线思维，看不懂技术迭代的宏大趋势，只纠结于眼前的得失与生计。那时的我笃信，规律大于个体，时代浪潮从不为普通人的窘迫驻足，所有局部的苦难，放在宏观叙事里，都是可以被忽略的细碎尘埃。\n\n可走遍万水千山，看过无数繁华与破败的对冲，我才慢慢发现，真正狭隘的人，从来都是我自己。我深谙世间所有苦难的成因，却一次次在具象的苦难面前，选择了沉默与漠视。\n\n我坚持数年联合国儿童基金会的月捐，习惯这种遥远、匿名、无压力的善意。隔着屏幕与山海，善意是温柔的、无痛的、体面的。我不用对视任何人的窘迫，不用承接任何人的求助，不用面对阶层落差带来的尴尬。这份善意，是我留给自己的道德自留地，干净、从容，无需挣扎。\n\n可当苦难真正落到眼前，落到活生生的人身上，我所有的温柔与善意，仿佛瞬间尽数失语。\n\n在土耳其古老的欧式街区里，晚风裹着异域的烟火，我坐在街边安然用餐。一位抱着孩子的当地女人驻足良久，用我听不懂的语言低声求助，眼神局促又无助。而我，只是沉默对视，手上的动作未停，任由服务员将她匆匆赶走。我明知钱包就在身侧，几张薄薄的纸币，便能缓解她片刻的窘迫，可我最终选择了无动于衷。\n\n看见带病打扫客房的保洁老阿姨，便悄悄在床头留下一笔足够她添置些许慰藉的现金。我不敢当面给予，不敢接受道谢，不敢直面那份不对等的体面。我厌恶居高临下的施舍，却又实实在在地，在最需要温柔兜底的时刻，选择了冷漠旁观。\n\n这样的矛盾，贯穿了我所有的旅途。\n\n六月的曼谷，我长居街边公寓，无数次路过街头垂垂老矣的乞讨者。老人佝偻的脊背、沧桑的眉眼，让我不忍直视，却从未停下脚步。我看着白人游客俯身慷慨解囊，看着旁人温柔善待弱者，而我一次次侧身、路过、漠视，任由心底的不忍翻涌，却始终不肯掏出一丝善意。\n\n我走过香港的天桥，见过露宿的旅人；踏过澳门的街巷，见过奔波的外籍劳工；穿行过世界各地，见过底层人群挣扎谋生的模样。我看得懂他们苦难的根源，是制度、是通胀、是阶层固化、是资源倾斜、是整个世界不对等的运转体系。\n\n我的理性清清楚楚告诉我：个人的微薄施舍，终究杯水车薪。改变不了崩盘的经济，改写不了固化的阶层，救赎不了系统性的贫困。单次的善意，只是短暂的慰藉，终究挡不住时代洪流里普通人的颠沛流离。\n\n于是，我以“无力改变根源”为借口，一次次放任自己的冷漠。\n\n我终究活成了自己最矛盾的样子：远距离悲悯众生，近距离冷漠自私；擅长解构苦难，却不敢承接苦难。\n\n我懂得所有宏大的叙事，看透资本繁荣之下普通人的生存挤压。我写得出最精准的产业研判，能戳破所有时代泡沫，深知这套光鲜的发展体系，本就建立在无数普通人的隐忍与消耗之上。\n\n可最讽刺的是：我看清了所有真相，却依旧束手无策，甚至不愿给出举手之劳的温柔。\n\n我会在无人之时，为世间疾苦唏嘘悲悯，会为底层人群的身不由己心生悲哀，会看穿世界的冰冷与不公。可当苦难直面而来，打破我的节奏、侵入我的边界，我的本能永远是逃避、是推开、是漠视。\n\n我偏爱所有无压力、无交涉、匿名的善良，却惧怕所有直面窘迫、需要当场抉择的人间拉扯。我厌恶自己的虚伪：可以长久为远方的陌生人奔赴善意，却对眼前真切的苦难冷眼旁观；可以看透世间所有不公，却连片刻的温柔都吝啬给予。\n\n我是清醒的观测者，也是懦弱的普通人。我的理性，让我看透了世间苦难的无解，让我知晓个人力量的渺小，让我不屑于自我感动式的廉价救赎；而我的悲悯，是刻在骨子里的人性底色，让我无法彻底麻木，无法心安理得地漠视人间疾苦，让我在每一次沉默之后，陷入无尽的自我审判与内耗。这个世界本就如此荒诞：宏大的时代叙事永远歌颂繁荣与进步，可撑起繁荣的，永远是无数普通人无声的牺牲与妥协。资本的车轮滚滚向前，技术迭代永不停歇，世人追捧着 AI 赋能万物的美好愿景，却无人在意，无数底层之人，正在为这套宏大的叙事负重前行。\n\n而我，恰好卡在中间最煎熬的位置。\n\n我既无法像麻木的利己者一般，心安理得享受时代红利，对众生疾苦视而不见；也无法成为纯粹的善人，抛开利弊权衡，不计得失地温柔渡人。\n\n我带着一双看透世事的眼睛，揣着一颗柔软又怯懦的心，清醒地痛苦，克制地善良，理智地冷漠。", "createdAt": 1788432793214, "id": "post-08"}, {"title": "我不信理想了，但我敬重信过的人", "kind": "随笔", "chapter": "个人法则与成长", "dateLabel": "2026年7月", "dateSort": 20260702, "lang": "zh", "order": 9, "content": "前段时间刷到一组 1960 年代日本学生运动的老照片。黑白影调，振臂的年轻人，墙上刷着注定实现不了的标语。\n\n我被打动了。\n\n这很不对劲。我一向反感盲目和偏执，把当下的意识形态和政治正确都看成工具和手段，平时看到现实里那些执念狂热的人，只觉得他们脱离现实、毫无意义。凭什么隔着六十年，同样盲目、同样偏执的一群人，在我眼里就成了理想主义？\n\n我把这个矛盾拆了很久，拆出来三层，一层比一层不体面。\n\n第一层是审美骗局。照片会筛选记忆：历史只保留了振臂高呼的画面，因为它有冲击力；那个年代同样有大把随大流的、被裹挟的、纯粹为了站队自保喊两句口号的人，只是没人拍他们。黑白影调加上泛黄质感，天然自带悲壮感，让人来不及想这帮人到底信的是什么、后来怎么样了。我要是真穿越回 1968 年站在人群里，大概率会觉得“这帮人有点疯”，而不是“好理想主义啊”。\n\n第二层是距离和剪辑。现实中的狂热是进行时——我看得到这个人在为什么较真、他的偏执给身边人添了什么麻烦、这事大概率不会有像样的结局。细节太具体，就显得不值得。老照片是完成时，而且被压缩成了一个符号：组织内部怎么倾轧、教条有多荒谬，多少人后来后悔或者装死不提，历史全帮我筛掉了，只留一个干净的剪影。不是过去的理想主义更高级，是距离让它看起来更高级。\n\n第三层最不体面，所以我更得写下来。当下的意识形态，我是局内人——它活着，会要求我站队，会绑架我，我必须对它设防。而 1968 年那批人信的东西已经死了，它不会再要求任何人做任何事。我敬重的从来不是他们信的内容，是“信”这个动作本身——而我只敢在它彻底无害之后才给出这份敬重。历史替我把风险清零了，我才敢宽容。这份宽容是打了折的，我心里清楚。\n\n但拆到这里还没完。为什么“信”这个动作能打动我？\n\n因为我自己信过。\n\n说实话，谁没想过为社会、为国家、甚至为全人类贡献点什么呢？而且我当年不是嘴上说说——是真的坚信，只要够努力、牺牲够多，那个理想总有一天能实现。现在不一样了。做分析这行做久了，太清楚这个世界的运转有多少惯性、多少是利益和数字说了算，不是靠信念能推动的。\n\n所以死掉的其实不是理想。死掉的是“理想会实现”的笃定。我大概还是希望世界更好，但我已经不指望靠“信”让它更好了。老照片戳中的我，正是那批人身上我已经失去的东西——不是理想本身，是敢于笃定的能力。\n\n想清楚这个之后，我也终于弄明白了自己在现实里真正反感的是什么。分界线从来不是“理想主义对现实主义”，是真信对假装。真的信念会落成具体的行动，不管多小，它让某件事、某个人实实在在变好了一点。而我厌恶的那种人，是把信仰当皮、里子全是算计——喊着大义，捞的是自己的身份、流量和好处。对理想的表演，比没有理想更败坏理想。\n\n最后交代一下那份念想的下落。它没消失，只是换了个高调的活法：变成了具体的、算过账的、能落到身边人头上的事。我做分析、写东西，最大的希望是它能帮到我自己和对我有意义的人——这话不宏大，但它是真的，而“真的”这个属性，是当年那些口号到最后都没能保住的东西。\n\n不过我还是给自己留了一个不设防的角落。看到墙上一句注定实现不了的口号，我还是会感动。感动的不是它能实现——是居然有人真心觉得，这值得追求。\n\n人还有能力去相信点什么。这件事本身，值得留着。", "createdAt": 1788432793214, "id": "post-09"}, {"title": "弱冠记十二条——我自己摸出来的规矩", "kind": "手记", "chapter": "个人法则与成长", "dateLabel": "2026年8月10日", "dateSort": 20260810, "lang": "zh", "order": 10, "content": "写给将来的我自己，也许还有你\n\n---\n\n序\n\n二十岁写回忆录是件荒唐事。我知道。\n\n但我发现真正的问题不是资历不够，是“记性会骗人”。人会不断重写自己的过去，把犹豫改成远见，把运气改成本事，把当时明明没想清楚的事，追认为一直想得很清楚。这个过程不需要恶意，它自动发生。\n\n所以这份东西的用途不是记录我做对了什么。它的用途是“锁住证据”。\n\n将来如果我变成了现在的自己会看不起的那种人，这份文件应该能告诉我，是从哪一步开始的。如果我没有变成那种人，那它就是一份可以给你看的东西——不是为了让你照着做，是为了让你知道，我在二十岁的时候，是靠哪几条规矩活着的。\n\n写下来的时候我没打算把自己写好看。凡是能让我显得聪明的地方我都留了，凡是让我难看的地方我也留了。后者比前者有用。\n\n## 1　先看数字配不配它的位置\n\n2026 年 6 月，我看到一个数字：存储芯片的毛利率做到 70% 以上，超过了英伟达。\n\n绝大多数人当时在算它还能涨多少。我想的是另一件事——存储是配套环节，配套环节凭什么比核心环节赚得更多？这不是竞争优势，这是供需暂时失衡。\n\n三周后，那家公司的会长自己在公开场合说，芯片价格处在“非正常高位”。他用的词和我几乎一样。\n\n拿到任何数字，第一件事不是问它会往哪走，是问它配不配它所在的位置。位置决定合理区间，偏离区间就是信号。这个动作后来我用在了所有事情上，不只是钱。\n\n## 2　宣称是廉价的，机制是昂贵的\n\n判断任何一个组织、制度、系统、人，不要听他说要做什么，去看他“能不能不做”。\n\n我分析过一个局面：五家最大的科技公司同时在烧钱建数据中心，明知回报还没兑现。为什么停不下来？不是因为他们疯了，恰恰因为每家单独看都很理智——谁先减速，谁的份额就归对手。这是囚徒困境，不是集体癫狂。\n\n一旦你学会看结构而不看意愿，很多让人愤怒的事情会突然变得可以理解，也会突然变得更难解决。这两件事是一起来的。\n\n## 3　你不需要预测未来，你只需要找到接不上的那个接口\n\n这是我最好用的一招，也是最容易学的一招。\n\n不要试图预言结局。去找“两件不能同时成立的事”。\n\n卖芯片的公司靠“技术迭代极快”支撑估值，买芯片的公司按五六年折旧记账——迭代越快，旧设备残值掉得越凶。这两个前提不能同时为真，必有一边在自欺。\n\n三十年期国债收益率站上 5%，创十八年新高，同时最依赖远期现金流的股票估值毫无折价。肯定有一个错了。\n\n多头需要整个故事全线连贯，你只需要找到一个断点。这比预测容易得多，也可靠得多。将来无论你做什么行业，这一招都能用。\n\n## 4　话要事前说，并且留下时间戳\n\n6 月 27 日凌晨一点零七分，我把那个判断公开发了出去。\n\n它后来对了。但我要说的重点不是它对了——是它“带时间戳”。事前说出口、事后改不掉，这是唯一能防止我事后重写记忆的办法。\n\n我见过太多人事后说“我早就看出来了”。他们大概不是在撒谎，他们是真的相信。人对自己的诚实，靠意志力是守不住的，得靠制度。\n\n没有留痕的正确，等于没有正确。\n\n## 5　给对手的最强版本留档\n\n我看空的时候，摩根大通说芯片股超卖、存储紧张能延续到 2028 年，摩根士丹利说回调是买点。\n\n我把这些如实记了下来，一条不删，而且承认：辩论的题目已经从“利润率见顶了吗”变成“紧张还能持续多久了”。\n\n这个动作一点快感都没有。但它是唯一能让人知道自己什么时候错了的机制。只收集有利证据的人，永远不会知道自己错了——只会突然发现自己亏了。\n\n将来你要是发现自己身边所有的声音都在同意你，那不是你对了，那是你把耳朵关小了。\n\n## 6　看对方向，不等于拿到时间\n\n这条是我用真金白银买来的，所以写得详细一点。\n\n7 月 23 日，谷歌把资本开支指引又上调了一档。我当时明知道三十年期美债在 5% 上方已经站了二十七天，明知道“借债扩张撞上多年高位的利率”就是我自己写下的核心逻辑——我还是买了。\n\n计划持有三天。实际持有一小时。市场当晚就把这个消息当利空卖了，我割掉，亏了几百美元。\n\n美元不重要，那一小时重要。它证明了一件事：“我知道，但我没做到。”我不是判断错了，我是在一个自己完全推演清楚的局面里，因为不甘心错过，违背了自己的规矩。\n\n所以这条规矩其实是两条：信号只标记“这个结构变脆了”，从不标记“它明天会断”。你可以在逻辑上完全正确，同时在时间上被消灭。\n\n分析是一门功夫，执行是另一门。到我写这段话的时候，我在前一门上的分数明显高于后一门。如果你将来看到我在这一点上没什么长进，别惊讶，这是最难改的地方。\n\n## 7　对别人、只给方向，不给买卖点\n\n我给家里的群发过很多分析。5 月初推过一个方向，6 月底又把看空的判断发进同一个群，闭环给清楚。但我从来没说过“买”或者“卖”。\n\n原因很简单，也很冷：归因是不对称的。赚了是他们自己的本事，亏了或者错过了，是我的错。这不是自私，这是把责任放在能承担的地方。给判断，不给指令：把我的推理过程完整交出去，让他们自己下结论。这样对错都还在他们手上，关系不会被一笔交易毁掉。\n\n将来你如果要给亲近的人建议——任何建议，不只是钱——记住这条。\n\n## 8　标准要对称，尤其是对自己\n\n我写过一篇挺锋利的文章，批评网上那些高喊某种立场的人：说他们只找确认自己的证据，说他们用一个身份来替代真实的努力，说他们其实是在逃避面对自己。\n\n后来我意识到，那篇文章本身就在犯它诊断的病。我全程单向取证，只审计一边；我提供的其实是另一种同样廉价的身份——清醒者、看透者；我甚至替上千万人裁定了内心状态，写了一句“他们都知道，只是选择不在乎”——而在同一时期的另一篇论文里，我通篇都在论证不能替他人裁定动机。\n\n这件事我记下来，因为它暴露了我最大的毛病，而且这个毛病不止出现在写作里：我的方法在我不投入身份的地方极其锋利，在我投入的地方会自动关掉。\n\n七月那一小时的多头单是它，那篇文章是它，还有一件私事也是它（下面第十一条）。三次都不是不知道，三次都是在有情绪的地方，把“确认”当成了“研究”。它的伪装极好，因为看起来跟勤奋一模一样。\n\n如果这份文件只留一条，我希望留这一条。\n\n## 9　亲眼撞见的人，绕不过去\n\n我在伊斯坦布尔——那是那个国家最发达的城市——没有刻意去找，就撞见了太多身体不好还在上班的老人，和街头讨生活的人。\n\n我写过一整篇论文论证：不存在超越立场的客观道德标准，一切道德判断都相对于立场和权力。逻辑上我至今认为那篇是对的。\n\n但那天我说的是另一句话：理论和数据都可以吵，亲眼撞见的具体的人，绕不过去。\n\n严格讲这两句话是冲突的。我后来想明白了，这不是漏洞，这是我的底。我的道德起点不是被推导出来的，是被撞见的。相对主义在抽象层面完全成立，在一个抱着孩子站在你面前的人面前失效。\n\n所以“各人过各人的日子、互不干涉”这个结论有一个下限：可以互不干涉，但不能对眼前的人视而不见。\n\n这条是我少数愿意直接交给你、不附加论证的东西。\n\n## 10　混杂的动机说出来，就不再是自欺\n\n我给一家英国报纸投过一篇关于 AI 的稿子。文章我是真心想写的，但我也很清楚：有一半动机是给一个商科学生的履历做区分度。\n\n我把这个动机说出来了，包括写在这份文件里。\n\n动机混杂不是问题，掩盖它才是。说出来之后，那篇文章的质量得自己站住，不能再靠“我是纯粹的”来加分。这是我给自己设的一个小机关：凡是我不太愿意承认的动机，一律先承认掉，剩下的东西才是真的。\n\n## 11　该说的话，当场说\n\n有一件事我拖了 4 年。\n\n高中的时候有个人。有过一次机会，很近，我什么都没做，也什么都没说。后来分班后我开了口，得到一个模糊的回答，然后各奔东西。这 4 年里我没有真正往前走过，也没有真正结束过——发过隐晦的动态，留着几张照片换了好几部手机，看到她的动态临时改过一次行程。\n\n我用自己最熟的语言给它下过定义：这是一个开着的仓位，没有到期日。没有一个明确的了结事件，所以它一直在那里，占着地方，不产生任何东西。\n\n我今年十二月想要去一趟，不为了什么结果，就为了给它一个体面的结束。\n\n这条规矩我写给你，不是让你早恋。是这个：世界上大部分遗憾不是因为你选错了，是因为你没选。站在门口试探、发暗示、等对方先动，看起来是保护自己，实际上是把决定权交给时间，然后由你独自承担全部利息。\n\n试探是免费的，所以人会一直试探。当场说话要付代价，所以人会一直拖。但只有第二种能让事情结束。\n\n## 12　留一块不讲效率的地方\n\n我平时看数据、算概率、判断趋势，这套东西泡久了，人会对一切“没有用”的东西失去耐心。\n\n所以我给自己留了一块不讲效率的地方：古文、对联、周易。写对联我不考据，凭直觉和感觉，好几次凑得并不工整。这些东西不能帮我赚一块钱，也不能让任何判断更准。\n\n但我发现，一个人如果只剩务实，会慢慢变成一台估值机器——什么都能定价，什么都不相信。我对几十年前那些同样荒谬的信念保持敬意，不是敬重他们信的内容，是敬重“信”这个动作本身。我也很清楚这份宽容是打了折的：历史已经替我把风险清零了，我才敢给出来。\n\n这个自觉要保留。但那一块地方也要保留。\n\n给自己留一件不产出任何东西的爱好，并且不为它辩护。\n\n---\n\n给你\n\n如果你读到这里，我大概已经不是写下这些字的那个二十岁的人了。\n\n我不指望你照着这十二条做。这些是我从我自己的错误里摸出来的，你的错误会是别的样子，所以你需要的规矩也会是别的样子。你唯一需要从这里拿走的，是“给自己立规矩、然后留下证据检验它”这件事本身。\n\n但有几句我还是想说得直白一点：“不要追求终极正确，追求不自欺。”我很早就放弃了“找到唯一正解”这个目标，我写过的所有东西，最好的结论也只是“最不坏的答案”。剩下唯一的标准就是别骗自己——而这件事靠意志力守不住，得靠机制：把话事前说出口，把反方的最强版本记下来，把不体面的动机先承认掉。\n\n“对抽象保持怀疑，对具体保持责任。”意识形态、口号、宣称、指引、叙事，全部打折处理。家人、朋友、眼前的具体的人、你亲口许下的承诺，全额计价。这两句是一体的：正因为对大词不信，才必须对小事守信，否则一个人就什么都不剩了。\n\n最后一条，是我做这一切的原因，也是我从不写进文章里的：我做那些分析，最大的希望是它能帮到我自己和对我有意义的人——这一条不需要论证，也不需要方法论。它是全部动机里唯一一条本来就成立的。\n\n---\n\n写在最后\n\n这份东西必须被改。\n\n如果十年后这十二条一条没改，那就是坏消息了。那说明我停在了二十岁，只是把当时的判断供了起来。\n\n回首向来萧瑟处，也无风雨也无晴。等真到了能说这句话的年纪，这份文件应该已经很厚，而且到处是划痕。", "createdAt": 1788432793214, "id": "post-10"}, {"title": "一个成熟的男人，大概要经历五重蜕变", "kind": "随笔", "dateLabel": "2026年8月31日", "dateSort": 20260831, "lang": "zh", "order": 11, "createdAt": 1788432793214, "content": "「以为李新野江郎才尽了，没想到还是如此犀利」\n\n看完突然觉得，一个成熟的男人，大概先要成为晏几道：\n\n爱情早就结束了，岁月远去，独自在漫长岁月里一遍遍回望旧时光。\n\n> 梦魂惯得无拘检，又踏杨花过谢桥。\n\n然后就是变成孙宇晨：\n\n> 我没有哭。我一直在等我哭。\n> 一百万人像潮水一样涌来，烟花结束，一百万人退去。\n\n接着大概变成李新野：\n\n感觉自己看透了、把每个人都分类放好、自己好像可以超脱其中、像是终于找到了某种解释世界的方法、甚至能写《人妻约会指南》。\n\n再后来大概变成王小波：\n\n不急着判断谁好谁坏，只把关系真正写出来。过程荒诞、魔幻，甚至偶尔有些恶趣味，但经历本身已经足够有趣，也足够让人学到东西。\n\n最后还是想成为马尔克斯：\n\n不再急着解释爱情，不再执着于证明谁对谁错。把生活、欲望、孤独、性爱、时间，全都放进一个魔幻现实主义的世界里。它未必给你答案，但它会赋予经历意义，也会让人受到教育。\n\n人大概总要从怀念，到沉溺，到解释，到观察，最后学会接受。\n\n到那时候，爱情已经不再需要一个答案。\n\n这大概就是“曾学”\n\n---\n\n原文链接：李新野《景甜、张继科，性工作者的爱情》 https://sinyalee.com/blog/?p=1343", "id": "post-11"}, {"title": "肉夹馍", "kind": "随笔", "dateLabel": "2026年10月18日", "dateSort": 20261018, "lang": "zh", "order": 12, "content": "明朝年间，西安城西门外有个卖肉夹馍的汉子，姓王，排行第二，人称王二。\n\n王二原本只是个寻常生意人，每日天不亮便起来和面、切肉、烧炉子，挣几个辛苦钱。后来西域来了几个波斯商人，带来一种从未见过的香料。王二花了半个月的工钱买下一包，反复试了几十回，终于配出一种新味道。\n\n这味道与寻常肉夹馍大不相同。肉还是那块肉，馍还是那个馍，只是加了这香料，竟能让人吃过一次，三日不忘。\n\n消息传开，买馍的人越来越多。王二从早卖到晚，仍然供不应求。\n\n王二是个聪明人。他想，天下这么大，自己一个人能烙多少馍？纵然在西安开上一百家店，也未必能把生意做到江南。\n\n于是他不再只卖馍。\n\n他请来城里最好的铁匠，把自己烙馍的炉子改了又改，制成一种特别的铁炉。炉中装有他亲手调配的秘制香料，火候、烟气、香味，样样与众不同。旁人纵然知道用的是什么肉、什么面，也做不出一样的味道。\n\n王二给这炉子取名叫“王家神炉”。\n\n他对外说，凡是买了他的炉子，再照他的法子做馍，便能做出与西安总店相差无几的味道。\n\n天下的商人闻讯而来。\n\n一开始，有人嫌炉子太贵。王二便说，贵有贵的道理。寻常铁炉一天只能烙几十个馍，王家神炉却能烙几百个。况且香料仍须向王二采买，旁人仿不出来。\n\n商人们算了账，觉得有利可图，便纷纷掏钱。\n\n王二的生意从此不同了。\n\n过去他卖一个馍，赚的是一个馍的钱。如今他卖一座炉子，赚的是几百、几千个馍的钱。至于买了炉子的人，能不能把那些馍全部卖出去，便不是他眼前要操心的事了。\n\n一年之后，王二的炉子已经卖到了江南。\n\n那年秋天，他遇见一个年轻人，姓张，排行第三，人称张三。\n\n张三从前在外地经营矿场，后来矿场生意不好，便转而做些别的买卖。他听闻王二的神炉日进斗金，特意赶来西安。\n\n张三说：“王掌柜，我想买你一百座炉子。”\n\n王二问：“你要开一百家馍铺？”\n\n张三摇头：“我不开馍铺。我建一间大厨房，把炉子摆进去，谁想做馍，便来租我的炉子。我按时辰收钱。”\n\n王二想了想，觉得这主意不错。\n\n张三又说：“只是炉子太贵，我手里没那么多现银。”\n\n王二问：“那你拿什么买？”\n\n张三说：“借。”\n\n王二听了，笑了笑。\n\n“借钱买炉子，拿炉子挣钱，再还借来的钱。这本就是做生意的道理。”\n\n于是张三去了钱庄。\n\n钱庄掌柜问他借多少。\n\n张三报出一个数目，掌柜吓了一跳。\n\n“这么多钱，你拿什么抵押？”\n\n张三说：“王二的神炉。”\n\n掌柜摇头：“炉子值钱，可炉子不能自己生钱。”\n\n张三不慌不忙，从怀里取出一纸契约。\n\n原来京师有一家姓沈的大商号，家资雄厚，生意遍及天下。沈家也想经营新式肉夹馍，却不愿自己建厨房、买炉子，便与张三约定，往后几年，按月租用张三的炉子，每月支付租金。只要炉子按约备妥，沈家便须按契付钱，用不用足时辰，是沈家自己的事。\n\n掌柜接过契约，看了许久。\n\n沈家是天下数得着的大商号，向来信誉极好。\n\n掌柜心想，张三自己或许还不起钱，但沈家总归付得起租金。\n\n于是银子借出去了。\n\n张三拿着银子，回到西安，向王二买下一百座神炉。\n\n王二收了钱，命工匠昼夜赶工。\n\n三个月后，炉子运到了扬州。\n\n张三租了地，盖了厨房，雇了伙计，生意就这样做起来了。\n\n沈家按契来租炉子，别的商号见了，也纷纷效仿。\n\n张三没有骗钱庄。他的炉子确实有人租，租金确实有人付，钱庄的利息也确实按时收到了。\n\n一时间，人人都说张三有眼光。\n\n只有张三自己知道，这生意并不容易。\n\n炉子虽然能挣租金，却也要花钱。厨房要修，煤炭要买，伙计要养，香料还得不断从王二那里进货。更麻烦的是，炉子买来便开始旧。\n\n王二每隔几个月就要推出一款新炉。\n\n新炉比旧炉烙得快，用的炭更少，香气也更浓。\n\n原先花大价钱买来的炉子，不过两三年，便成了旧货。\n\n张三问王二：“王掌柜，旧炉还能用，何必这么快出新炉？”\n\n王二说：“我若不出新炉，旁人便会追上来。况且新炉更好，你用了便知道。”\n\n张三想了想，觉得也有道理。\n\n他又去钱庄借钱。\n\n这一次，他要买三百座。\n\n钱庄掌柜问：“你那些旧炉怎么办？”\n\n张三说：“接着租。等有了新炉，租金还能收得更高。”\n\n掌柜又问：“若是旧炉租不出去呢？”\n\n张三说：“天下有的是想吃馍的人。况且，我已经签了不少新契。”\n\n掌柜看了看那些契约，果然厚厚一摞。\n\n有沈家的，有别家大商号的，还有几家专门研究新式馍法的书院。\n\n书院的人说，将来天下人不必自己烙馍，只需告诉书院想吃什么，书院便能代为调制，甚至替人想出从未见过的新馍。\n\n他们向张三租下许多炉子，又向沈家租下许多厨房。\n\n至于天下百姓愿意为这些新馍付多少钱，眼下还没有人算得很清楚。\n\n但契约已经签了。\n\n钱庄掌柜很满意。\n\n他觉得，有这么多契约在手，张三的生意自然是稳妥的。\n\n银子又借了出去。\n\n此后几年，张三的生意越做越大。\n\n他在扬州、苏州、杭州、南京各地建起厨房，炉子一批接着一批地买，借据一张接着一张地写。\n\n钱庄也想出了新法子。\n\n他们不再只看张三本人有多少家产，而是把每一处厨房单独立账。哪间厨房里的炉子归谁，哪家商号租用，未来几年能收多少租金，都写进契约。\n\n炉子押给钱庄，租金也先经过钱庄的账房。银子收上来，先还本息，剩下的才归张三。\n\n有些厨房租客可靠，契约签得长，钱庄便愿意少收些利钱。有些厨房租客名气不大，契约又短，钱庄便要收得贵些。\n\n后来还有钱庄把这些借据分成几等。\n\n上等的先收钱，下等的后收钱。有人专买上等借据，图个安稳；有人专买下等借据，图个利厚。\n\n甚至连替人养老、代人保管终身积蓄的几家大商号，也开始打听这些借据。\n\n他们说，沈家这样的商号租用厨房，租金有约，炉子有押，账目清楚，比借给寻常商贩稳妥得多。\n\n如此一来，张三能借到的钱越来越多，借钱的法子也越来越多。\n\n他自己都觉得不可思议。\n\n从前买十座炉子都要四处求人，如今只要契约写得漂亮，千座炉子的钱也有人愿意借。\n\n王二自然高兴。\n\n张三每借到一笔钱，就要来西安买一批炉子。\n\n王二收了银子，又雇铁匠，又建作坊，又从西域购进更多香料。\n\n他甚至开始亲自冶铁，不再依赖城里的铁匠。\n\n整个西安城，几乎都知道王二发财了。\n\n有一年，王二听说张三又要扩张，便主动找上门去。\n\n“张老弟，你的买卖做得这样好，我也想入一份。”\n\n张三问：“王掌柜想买几座厨房？”\n\n王二摇头。\n\n“我不买厨房。我出银子，认你铺子的股份。”\n\n张三大喜。\n\n王二不仅是自己的供货商，如今还愿意出钱支持自己，这对外说出去，岂不是天大的好消息？\n\n王二拿出一笔巨款，成了张三铺子的股东。\n\n消息传到各地钱庄，掌柜们纷纷称赞，说连王二自己都如此看好张三的生意，看来这买卖果真前途无量。\n\n有几个原本犹豫的掌柜，也终于答应借钱。\n\n张三拿着新借来的银子，又向王二订购了五百座新炉。\n\n王二收到货款，账上的收入又添了一大笔。\n\n不久，他还与张三另立了一纸契约。\n\n王二说：“你只管建厨房。往后若有炉子一时租不出去，只要厨房备妥、炉子能够正常开用，我可以按约租下那些空着的炉时。”\n\n张三问：“王掌柜自己要烙馍？”\n\n王二说：“眼下未必。不过天下要吃馍的人越来越多，留些炉子总是好的。”\n\n这契约又传到了钱庄。\n\n掌柜们听说连空着的炉子都有王二愿意租，心里更加踏实。\n\n张三的借据因此更好卖了。\n\n王二也觉得这是一举两得。\n\n一方面，他给张三的支持并不是无条件替他还债，契约只涉及符合条件的剩余炉时。\n\n另一方面，张三有了这份契约，便能借钱建更多厨房，买更多神炉。\n\n而只要炉子卖得出去，王二便能继续扩张作坊。\n\n就这样，王二卖炉子，张三租炉子，钱庄借钱，沈家和书院订炉子，各家商号又争着向书院投资。\n\n人人都有账可算，人人都有钱可赚。\n\n西安城里甚至有人说，王家的神炉早晚要卖遍天下，凡是人要吃饭的地方，就少不了王二的生意。\n\n又过了两年。\n\n事情开始有些变化。\n\n最先觉得不对的是扬州的一位老掌柜。\n\n他发现张三新借的钱一年比一年多，可每年真正留在手里的现银却始终不多。\n\n租金收上来，要先付钱庄的利息，再付厨房的开销，还要添置王二新出的炉子。\n\n尤其那些旧炉，虽然账上仍记着不小的价钱，真拿出去卖，却未必有人愿意接手。\n\n老掌柜问张三：“你的炉子如今有几千座了？”\n\n张三说：“快一万座。”\n\n“租出去多少？”\n\n“大半都有契约。”\n\n“银子收回来多少？”\n\n张三翻了翻账簿。\n\n老掌柜又问：“若是往后不再买新炉，单靠如今这些厨房，每年能剩多少现银？”\n\n张三没有立刻回答。\n\n他想了许久，说：“若是不再扩张，许多新签的契约便做不成了。”\n\n老掌柜点点头。\n\n“我不是问你能不能做成契约。我问你，能剩多少银子。”\n\n张三沉默了。\n\n其实张三并不是不明白。\n\n他有许多已经签好的生意，大商号也确实需要他的厨房。但为了履行这些契约，他得先建厨房、买炉子、雇伙计，把钱花出去，才能慢慢把租金收回来。\n\n契约是未来几年乃至十几年的事，钱庄的利息却是每月都要给的。\n\n何况有些厨房的租约只有三年，钱庄的借据却要五年才还清。\n\n到第三年租客走了，炉子仍在，债也仍在。\n\n张三相信到时候一定能找到新租客。\n\n钱庄从前也相信。\n\n直到那年秋天，有几家书院传出消息，说新式馍虽然奇妙，百姓却未必肯付那么多钱。有些书院每年花费巨万，卖出的馍却收不回多少银子。\n\n消息传开，商人们开始议论。\n\n有人说，这不过是新买卖刚兴起，待日后天下人都习惯了，自然能赚钱。\n\n也有人说，若是天下人愿付的馍钱，始终抵不上这些炉子和厨房的花费，又该怎么办？\n\n谁也说服不了谁。\n\n只是钱庄渐渐不肯再像从前那样爽快放钱了。\n\n从前张三拿着沈家的契约去借钱，掌柜看了便点头。\n\n如今掌柜却要问，沈家究竟把租来的炉子用在何处？书院究竟有多少人买馍？若是租客不续约，炉子还值多少银子？\n\n张三觉得委屈。\n\n他说：“从前你们只要看见契约便愿意借钱，如今怎么什么都要问？”\n\n掌柜叹了口气。\n\n“从前天下人都抢着要你的借据，如今已经有人急着卖了。”\n\n原来钱庄借给张三的钱，并不都是自己出的。有些借据早已转卖给别的商人。\n\n当年一百贯的借据，如今在市面上只卖八十余贯。\n\n债契上的利钱并没有变，只是买债的人如今嫌九分、十分的收益不够，折价买下来，才觉得划算。\n\n张三听了，心头一沉。\n\n他当然知道，自己以前借来的钱，仍照旧契付息，并不会因为旁人低价转卖借据，就立刻多出几分利息。\n\n可他也知道，若是明年还要借新钱，恐怕就不能照旧日的价钱借了。\n\n从前借一百贯，一年给九贯多利息，就有人抢着借。\n\n如今再去借，钱庄开口便要十五贯。\n\n张三拿算盘反复拨了几遍。\n\n若照这个利钱借钱买炉，再把炉子租出去，即便厨房日日有人，也未必剩得下多少银子。\n\n他对掌柜说：“这利钱太高，我做不成买卖。”\n\n掌柜说：“我也知道高。”\n\n张三说：“那你为何还要这么多？”\n\n掌柜说：“如今朝廷借钱，给的利钱已不算低。我拿银子借给你，总不能比借给朝廷还少赚。况且你的旧借据在市面上跌了价，我若不多要些，东家也不肯答应。”\n\n张三说：“可我有契约。我账上还有许多年都收不完的租金。”\n\n掌柜说：“你有契约，我知道。可你还要先把炉子买回来，把厨房建起来，才能照契收钱。”\n\n他顿了顿。\n\n“何况那一百贯的契约，是要几年之后慢慢收齐的。你欠我的钱，可不是几年以后才开始计息。”\n\n张三没有说话。\n\n他离开钱庄的时候，正逢大雨。\n\n街上行人都往屋檐下躲，只有他独自站在雨里，想起这些年签下的一摞摞契约。\n\n那些纸还在那里。\n\n字没有少一个，印章没有淡半分。\n\n只是忽然之间，没有人肯像从前那样，凭那些纸借给他钱了。\n\n他又想起王二。\n\n王二这几年生意兴隆，账上利润一年比一年多，新的炉子卖得越来越贵。\n\n张三便连夜赶回西安。\n\n见了王二，他没有寒暄，径直问道：“王掌柜，如今借钱的利钱，已经涨到十五分了。”\n\n王二听了，皱了皱眉。\n\n“这样高？”\n\n张三说：“是。”\n\n王二想了想，说：“你的厨房不是还有许多契约？”\n\n张三说：“有。只是钱庄如今连契约也要挑了。”\n\n王二说：“那你不妨少借些钱，先把眼前的生意做好。”\n\n张三苦笑。\n\n“我若少借钱，便不能买那么多新炉。新签的契约交不了货，租金也收不上来。可我若照旧借钱，光是利息就要吃去大半租金。”\n\n王二沉默了一会儿。\n\n张三又问：“你先前答应租下我卖不掉的炉时，这份契约还算不算数？”\n\n王二说：“当然算。只要照契约把厨房备好，炉子能够开用，我自然照约行事。”\n\n张三点了点头。\n\n王二又说：“况且，往后天下要用炉子的地方还多得很。我看你的生意，没有外头说得那么坏。”\n\n张三问：“那王掌柜能不能再借我些银子？”\n\n王二没有立刻回答。\n\n他当然拿得出一些钱。\n\n只是他已经认了张三铺子的股份，还答应租用剩余的炉时。若是再替张三还债，便又是另一回事了。\n\n况且西安的新作坊也在扩建，自己的银子并非用不完。\n\n过了一会儿，王二说：“张老弟，我看你还是先把现有的厨房经营好。借钱的事，终究要你自己拿主意。”\n\n张三听完，没有再说话。\n\n当天晚上，他便离开了西安。\n\n王二送他到门口，看着他的马车消失在夜色里。\n\n回到店中，账房先生正在清点今年的收入。\n\n账房高兴地说：“掌柜的，今年又比去年多赚了几成。”\n\n王二点点头。\n\n账房又拿出一摞订单。\n\n“这是扬州、苏州、南京几处新来的订货单。若照这个势头，明年咱们还得再开两座作坊。”\n\n王二接过来，翻了几页。\n\n订单确实很多。\n\n有张三的，有沈家的，还有几家他连名字都没有听过的新商号。\n\n这些商号都说要建厨房，要买神炉，要赶在别人前面占住地盘。\n\n王二看了一会儿，忽然问账房：\n\n“这些商号买炉子的钱，都是从哪里来的？”\n\n账房愣了一下。\n\n“这……小的倒没有细问。只知道多数都是钱庄借的。”\n\n王二又问：\n\n“那钱庄的钱呢？”\n\n账房说：“有自己的，也有从别处筹来的。有些还把借据转卖出去了。”\n\n王二低头看着那些订单。\n\n过了一会儿，他又问：\n\n“如今真正吃馍的人，一年究竟花了多少银子？”\n\n账房没听明白。\n\n“掌柜的说的是……”\n\n“我是说，天下百姓真正掏出来买馍的钱。不是买炉子的钱，也不是租厨房的钱，更不是钱庄借出去的钱。”\n\n账房想了想。\n\n“这……各家的账都在各家手里，咱们哪里知道。”\n\n王二没有再问。\n\n他当然知道，天下确实有许多人吃上了这种新馍。\n\n沈家的生意是真的，书院做出来的新花样也是真的。有人因为新式馍省了工夫，有人因此赚了钱，还有人愿意为一口好馍花比从前多得多的价钱。\n\n王二并不怀疑这些事。\n\n他只是忽然发觉，自己知道每年卖出去多少座炉子，却不知道那些炉子最终替天下人烙出了多少值得付钱的馍。\n\n账房还站在一旁，等他吩咐明年的作坊扩建。\n\n王二想了一会儿，挥了挥手。     return joined.length > 96 ? joined.slice(0, 96) + '…' : joined;
  }

  function go(path){ location.hash = '#' + path; }
  function currentPath(){
    var h = location.hash.replace(/^#/, '');
    return h || '/';
  }

  function renderIndex(){
    if (!POSTS.length) {
      main.innerHTML = '<div class="empty-state">还没有文章。</div>';
      return;
    }
    var list = POSTS.slice().sort(function(a,b){
      var d = (b.dateSort||0) - (a.dateSort||0);
      if (d !== 0) return d;
      return (b.order||0) - (a.order||0);
    });
    var html = '<section class="chapter">';
    list.forEach(function(p){
      html += '<a class="post-row" href="#/post/' + p.id + '" data-nav="/post/' + p.id + '">';
      html += '  <div class="post-main"><div class="post-title">' + escapeHtml(p.title||'无题') + '</div>';
      html += '    <div class="post-excerpt">' + escapeHtml(excerptOf(p.content)) + '</div></div>';
      html += '  <div class="post-meta"><span class="tag">' + escapeHtml(p.kind||'') + '</span><span>' + escapeHtml(p.dateLabel||'') + '</span></div>';
      html += '</a>';
    });
    html += '</section>';
    main.innerHTML = html;
    document.title = 'Chengxin Zeng';
  }

  function renderPost(id){
    var p = POSTS.find(function(x){ return x.id === id; });
    if (!p) { main.innerHTML = '<div class="hint">没有找到这篇文章。</div>'; return; }
    var html = '<article class="post-doc">';
    html += '<a class="back-link" href="#/" data-nav="/">← 返回目录</a>';
    html += '<div class="doc-head">';
    html += '<h1 class="doc-title">' + escapeHtml(p.title||'无题') + '</h1>';
    html += '<div class="doc-meta-row"><span class="tag">' + escapeHtml(p.kind||'') + '</span><span>' + escapeHtml(p.dateLabel||'') + '</span></div>';
    html += '</div>';
    html += '<div class="doc-body">' + renderContent(p.content) + '</div>';
    html += '</article>';
    main.innerHTML = html;
    document.title = p.title + ' — Chengxin Zeng';
  }

  function renderAbout(){
    var html = '<article class="about-doc">';
    html += '<div class="doc-head"><div class="doc-crumb">关于</div><h1 class="doc-title">写在前面</h1></div>';
    html += '<div class="doc-body">' + renderContent(ABOUT_TEXT) + '</div>';
    html += '</article>';
    main.innerHTML = html;
    document.title = '关于 — Chengxin Zeng';
  }

  function route(){
    var path = currentPath();
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b.getAttribute('data-nav') === path || (path === '/' && b.getAttribute('data-nav') === '/'));
      if(b.hasAttribute('data-nav')){
        if(b.classList.contains('active')) b.setAttribute('aria-current', 'page');
        else b.removeAttribute('aria-current');
      }
    });
    window.scrollTo(0,0);
    if (path === '/') return renderIndex();
    if (path === '/about') return renderAbout();
    if (path.indexOf('/post/') === 0) return renderPost(path.slice(6));
    renderIndex();
  }

  document.addEventListener('click', function(e){
    var navEl = e.target.closest('[data-nav]');
    if (navEl) { e.preventDefault(); go(navEl.getAttribute('data-nav')); }
  });

  window.addEventListener('hashchange', route);
  window.addEventListener('scroll', updateProgress, {passive:true});
  window.addEventListener('resize', updateProgress);
  route();
  updateProgress();
})();
</script>
</body>
</html>
